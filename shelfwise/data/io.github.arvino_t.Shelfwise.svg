<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Своя библиотека: полка с книгами (значок приложения в стиле GNOME) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5a80"/>
      <stop offset="1" stop-color="#26405f"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8935a"/>
      <stop offset="1" stop-color="#9c6b3a"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="2"/>
  <!-- книги -->
  <g stroke="#000" stroke-opacity=".18" stroke-width="1">
    <rect x="22" y="38" width="15" height="54" rx="2.5" fill="#e66100"/>
    <rect x="39" y="30" width="17" height="62" rx="2.5" fill="#f6d32d"/>
    <rect x="58" y="44" width="13" height="48" rx="2.5" fill="#2ec27e"/>
    <rect x="73" y="34" width="15" height="58" rx="2.5" fill="#99c1f1"/>
    <!-- наклонённая книга -->
    <rect x="90" y="40" width="14" height="52" rx="2.5" fill="#c061cb" transform="rotate(14 104 92)"/>
  </g>
  <!-- полосы на корешках -->
  <g fill="#fff" fill-opacity=".55">
    <rect x="25" y="46" width="9" height="3" rx="1.5"/>
    <rect x="25" y="80" width="9" height="3" rx="1.5"/>
    <rect x="42" y="38" width="11" height="3" rx="1.5"/>
    <rect x="42" y="44" width="11" height="2" rx="1"/>
    <rect x="61" y="52" width="7" height="3" rx="1.5"/>
    <rect x="76" y="42" width="9" height="3" rx="1.5"/>
    <rect x="76" y="80" width="9" height="3" rx="1.5"/>
  </g>
  <!-- закладка -->
  <path d="M48 30 v14 l3.5 -3 l3.5 3 V30 z" fill="#e01b24"/>
  <!-- полка -->
  <rect x="14" y="92" width="100" height="10" rx="3" fill="url(#shelf)"/>
  <rect x="14" y="92" width="100" height="3" rx="1.5" fill="#fff" fill-opacity=".25"/>
</svg>
