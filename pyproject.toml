[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litres-reader"
version = "0.14.0"
description = "LitRes Reader — read and listen to books bought on LitRes, plus your own e-books (Linux and Windows)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6>=6.10,<6.12"]

[project.gui-scripts]
litres-reader = "litres_reader.app:main"

[tool.setuptools]
packages = ["litres_reader"]

[tool.setuptools.package-data]
litres_reader = ["web/*", "web/vendor/*", "web/foliate/*", "web/foliate/vendor/*",
                 "web/foliate/vendor/pdfjs/*", "web/foliate/vendor/pdfjs/cmaps/*",
                 "web/foliate/vendor/pdfjs/standard_fonts/*", "data/*", "data/sym/*"]
