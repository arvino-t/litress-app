[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litres-reader"
version = "0.9.0"
description = "Читалка ЛитРес — книги и аудиокниги, купленные на ЛитРес (Linux и Windows)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6>=6.10"]

[project.gui-scripts]
litres-reader = "litres_reader.app:main"

[tool.setuptools]
packages = ["litres_reader"]

[tool.setuptools.package-data]
litres_reader = ["web/*", "web/foliate/*", "web/foliate/vendor/*", "data/*", "data/sym/*"]
