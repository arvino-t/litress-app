[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfwise"
version = "0.16.0"
description = "Shelfwise — build, read and organize your own library of e-books and articles; LitRes as a pluggable library (Linux and Windows)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6>=6.10,<6.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
shelfwise = "shelfwise.app:main"
# прежнее имя команды — для ярлыков и привычки
litres-reader = "shelfwise.app:main"

[tool.setuptools]
packages = ["shelfwise"]

[tool.setuptools.package-data]
shelfwise = ["web/*", "web/vendor/*", "web/foliate/*", "web/foliate/vendor/*",
             "web/foliate/vendor/pdfjs/*", "web/foliate/vendor/pdfjs/cmaps/*",
             "web/foliate/vendor/pdfjs/standard_fonts/*", "data/*", "data/sym/*"]
